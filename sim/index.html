<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장별 체험실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 연구 노트 한 권. 실험 세 개가 위에서 아래로 이어지고, 각 실험은 '조작판 + 펜 그림 + 읽는 법' 세 칸입니다. 종이 한 가지 모습만 씁니다. */
:root{
  --paper:#FBFAF6; --paper-2:#F3F1EA; --ink:#23262E; --ink-soft:#5B5F6B; --line:#C9C6BB;
  --blue:#2F55A4; --violet:#5D6FB3; --lav:#ECEFF9;
  --teal:#1E6E6E; --teal-bg:#E3F0F0; --amber:#9A5B12; --amber-bg:#FFF3DD;
  --alarm:#C2412D; --alarm-bg:#FBE6E1; --ok:#2E7D4F;
  --f-hand:"Gaegu","Nanum Pen Script","Gowun Dodum",cursive;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sketch:255px 12px 225px 14px / 14px 225px 12px 255px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  background-image:linear-gradient(var(--paper-2) 1px,transparent 1px);background-size:100% 28px}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--f-hand);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--violet);font-weight:700}
header.top{display:flex;flex-direction:column;gap:14px}
header.top h1{font-size:clamp(34px,6vw,50px);color:var(--blue)}
header.top .lead{max-width:62ch;color:var(--ink-soft)}
.film{background:#fff;border:2px solid var(--ink);border-radius:var(--sketch);padding:16px 18px;display:flex;gap:16px;align-items:flex-start}
.film svg{flex:0 0 56px}
.film div{min-width:0}
.film b{font-family:var(--f-hand);font-size:22px}
.film p{font-size:15px;color:var(--ink-soft)}
nav.jump{display:flex;flex-wrap:wrap;gap:8px}
nav.jump a{font-family:var(--f-hand);font-size:19px;color:var(--ink);text-decoration:none;border:1.5px dashed var(--ink-soft);border-radius:999px;padding:2px 14px;background:var(--paper)}
nav.jump a:hover,nav.jump a:focus-visible{border-style:solid;background:var(--lav)}
section.exp{display:flex;flex-direction:column;gap:18px;scroll-margin-top:12px}
.exp-head{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px}
.exp-head .no{font-family:var(--f-hand);font-size:44px;color:var(--violet);line-height:1}
.exp-head h2{font-size:clamp(26px,4.4vw,34px)}
.exp-head small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-soft);font-weight:400}
.q{font-size:17px;max-width:64ch}
.panel{background:#fff;border:2px solid var(--ink);border-radius:var(--sketch);padding:18px;display:flex;flex-direction:column;gap:16px}
.controls{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl label,.ctl .lbl{font-size:14px;color:var(--ink-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer}
.seg button,.btn{font-family:var(--f-hand);font-size:19px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:2px 14px;border-radius:var(--sketch);line-height:1.4}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:hover,.seg button:hover{background:var(--lav)}
.seg button[aria-pressed="true"]:hover{background:var(--ink)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:#244585}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
input[type=range]{width:min(320px,100%);accent-color:var(--blue)}
.val{font-family:var(--f-num);font-size:15px;color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.figure{overflow-x:auto}
.figure svg{display:block;width:100%;height:auto;max-width:100%}
.big{font-family:var(--f-hand);font-size:clamp(24px,4vw,30px);line-height:1.3}
.big em{font-style:normal;color:var(--alarm);background:linear-gradient(transparent 60%,var(--alarm-bg) 60%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border-top:2px solid var(--ink);padding-top:6px}
.stat span{display:block;font-size:13px;color:var(--ink-soft)}
.stat b{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums;font-weight:500}
.stat.alarm b{color:var(--alarm)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-soft)}
.legend i{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);border-radius:50%;margin-right:6px;vertical-align:-1px}
.box{border-radius:var(--sketch);padding:14px 16px;font-size:15px;max-width:none}
.box b.t{display:block;font-family:var(--f-hand);font-size:20px;margin-bottom:2px}
.box.teal{background:var(--teal-bg)} .box.teal b.t{color:var(--teal)}
.box.amber{background:var(--amber-bg)} .box.amber b.t{color:var(--amber)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}
table.cm{border-collapse:separate;border-spacing:6px;width:100%;font-size:14px}
table.cm th{font-weight:400;color:var(--ink-soft);font-size:13px;text-align:center}
table.cm td{border:2px solid var(--ink);border-radius:var(--sketch);text-align:center;padding:8px 4px;background:var(--paper)}
table.cm td b{display:block;font-family:var(--f-num);font-size:24px;font-weight:500}
table.cm td.tp{background:#E4F1E8} table.cm td.fp{background:var(--alarm-bg)} table.cm td.fn{background:var(--amber-bg)}
.meter{display:flex;flex-direction:column;gap:10px}
.meter .row{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3.4em;gap:10px;align-items:center;font-size:14px}
.meter .bar{height:14px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.meter .num{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mission{border:2px dashed var(--ink-soft);border-radius:var(--sketch);padding:12px 14px;font-size:15px;background:var(--paper)}
.mission.done{border-style:solid;border-color:var(--ok);background:#EEF6F0}
.mission b{font-family:var(--f-hand);font-size:20px;display:block}
.mission .st{font-size:13px;color:var(--ink-soft)}
.mission.done .st{color:var(--ok);font-weight:700}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log{font-family:var(--f-num);font-size:13px;line-height:1.6;max-height:180px;overflow:auto;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink-soft)}
.log div b{color:var(--ink);font-weight:500}
.reveal{display:flex;flex-direction:column;gap:6px}
footer{border-top:2px solid var(--ink);padding-top:14px;font-size:14px;color:var(--ink-soft);display:flex;flex-direction:column;gap:8px}
footer a{color:var(--blue)}
.links{display:flex;flex-wrap:wrap;gap:8px 18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
canvas.pix{display:block;image-rendering:pixelated;border:2px solid var(--ink);border-radius:6px;background:#fff;max-width:100%;height:auto;touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.row>*{min-width:0}
.cap{font-size:13px;color:var(--ink-soft)}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
textarea,input[type=text]{font:inherit;font-size:16px;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;background:var(--paper);color:var(--ink);width:100%}
select{font:inherit;font-size:15px;border:2px solid var(--ink);border-radius:8px;padding:4px 8px;background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-num);font-size:14px;border:1.5px solid var(--ink);border-radius:6px;padding:2px 8px;background:var(--paper)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;border:1.5px solid currentColor}

ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.list li{background:#fff;border:2px solid var(--ink);border-radius:var(--sketch);padding:10px 16px;display:flex;flex-direction:column}
ul.list a{color:var(--ink);text-decoration:none;font-size:18px} ul.list a b{font-family:var(--f-hand);font-size:22px;color:var(--blue)}
ul.list a:hover b{text-decoration:underline}
</style></head><body><div class="wrap">
<header class="top"><p class="eyebrow">영화관으로 간 AI 리터러시 · 웹부록</p><h1>장별 체험실</h1>

</div></body></html>
